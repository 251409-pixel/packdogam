const saved = JSON.parse(localStorage.getItem("fortuneDex")||"[]");
let filter="all";
const grid=document.getElementById("grid"), search=document.getElementById("search");
function render(){
 const q=search.value.trim().toLowerCase();
 let arr=entries.map((x,i)=>({type:x[0],text:x[1],id:i+1}))
 .filter(x=>filter==="all"||filter===x.type||(filter==="owned"&&saved.includes(x.id)))
 .filter(x=>!q||x.text.toLowerCase().includes(q));
 if(filter==="owned"&&arr.length===0){grid.innerHTML='<div class="empty">아직 등록한 문장이 없어요.<br>제품 QR을 찍어서 첫 번째 문장을 모아보세요!</div>';update();return}
 grid.innerHTML=arr.map(x=>{
   const owned=saved.includes(x.id);
   if(!owned && filter!=="owned") return `<div class="card locked"><div class="num">NO.${String(x.id).padStart(3,"0")}</div><div class="lock">?</div><div class="quote">QR을 찍어 이 문장을 발견해보세요.</div></div>`;
   const label=x.type==="luck"?"오늘의 운세":x.type==="warning"?" 운세":"";
   return `<div class="card"><div class="num">NO.${String(x.id).padStart(3,"0")}</div><div class="tag">${label}</div><div class="quote">${x.text}</div></div>`;
 }).join("");
 update();
}
function update(){
 const n=saved.length; document.getElementById("count").textContent=`${n} / ${entries.length}`;
 document.getElementById("fill").style.width=(n/entries.length*100)+"%";
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});
search.oninput=render;
document.getElementById("reset").onclick=()=>{if(confirm("등록한 도감을 모두 초기화할까요?")){saved.splice(0);localStorage.setItem("fortuneDex","[]");render();toast("도감을 초기화했어요.")}};
function register(id){
 id=Number(id); if(!id||id<1||id>entries.length){toast("1~102번 번호를 입력해주세요.");return}
 if(!saved.includes(id)){saved.push(id);saved.sort((a,b)=>a-b);localStorage.setItem("fortuneDex",JSON.stringify(saved));toast(`NO.${String(id).padStart(3,"0")} 등록 완료!`)}
 else toast("이미 등록한 문장이에요.");
 render();
}
document.getElementById("register").onclick=()=>{register(document.getElementById("code").value);document.getElementById("modal").classList.remove("show")};
document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("show");

// QR 연동: URL에 ?id=37 또는 ?code=37 이 붙어 있으면 자동 등록
const params=new URLSearchParams(location.search), qr=params.get("id")||params.get("code");
if(qr){register(qr)}
render();
</script>
